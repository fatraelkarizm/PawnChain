[package]
name = "pawnchain"
version = "0.3.0"
description = "PawnChain - AI-Appraised P2P Pawnshop & RWA Collateral Escrow on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pawnchain"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-program-idl = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.1.2", features = ["init-if-needed"] }
anchor-spl = "=1.1.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[workspace]

[lints.rust]
unexpected_cfgs = { level = "allow" }
